<!DOCTYPE html>
<html lang="th">
<head>
<meta name="theme-color" content="#1673D4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus Money">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
/*
  Bus Money — มือถือเป็นหลัก ถนัดขวา
  โครง: grid 4 แถว (หัว / เนื้อหาเลื่อนได้ / แถบพูด / เมนู) สูงเท่าจอพอดี ไม่มีส่วนไหนลอยทับกัน
  จุดเด่นเดียว: ปุ่มไมค์สีดาวเรือง ที่เหลือเงียบ เป็นรายการบนพื้นเรียบ
  ตัวอักษร: IBM Plex Sans Thai Looped (ไทยมีหัว อ่านง่ายบนจอเล็ก) ขนาด 13 / 15 / 17 / 20 / 28
*/
:root{
  /* ธีมฟ้า-ขาว สดใส: ฟ้าเป็นสีหลัก เขียวคือเงินเก็บ เหลืองดาวเรืองคือปุ่มไมค์ */
  --paper:#F2F8FF; --surface:#FFFFFF; --ink:#0E2744; --muted:#56708F; --line:#D8E6F5;
  --ledger:#1673D4; --ledger-ink:#FFFFFF; --ledger-soft:#E3F0FD;
  --save:#0B8456; --save-soft:#DFF5EA;
  --mic:#FFC21A; --mic-ink:#3A2A00;
  --bad:#D32F2F; --bad-soft:#FDE6E6;
  --chart-spend:#1E7FD8; --chart-save:#11A36A; --chart-grid:#CFE0F2;
  --font:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --fs-s:13px; --fs-b:15px; --fs-m:17px; --fs-l:20px; --fs-xl:28px;
  --gut:max(16px,env(safe-area-inset-left));
  --gut-r:max(16px,env(safe-area-inset-right));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0B1626; --surface:#122236; --ink:#E6F0FB; --muted:#9BB0C9; --line:#22364F;
    --ledger:#5AAEF5; --ledger-ink:#04203A; --ledger-soft:#163252;
    --save:#4FD39A; --save-soft:#123A2B;
    --mic:#FFC93C; --mic-ink:#2A2000;
    --bad:#FF8A80; --bad-soft:#3D1F1C;
    --chart-spend:#3A93E0; --chart-save:#24A874; --chart-grid:#2A3F58;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-b);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ledger);outline-offset:2px}

/* ---------- โครงหน้า ---------- */
#app{height:100%;height:100dvh;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;position:relative;background:var(--paper)}
/* ล็อกแถวให้ตายตัว: ส่วนที่ซ่อนอยู่ (แถบเตือน/ช่องพิมพ์) ไม่ทำให้ส่วนอื่นเลื่อนแถว */
#app>.top{grid-row:1}#app>.cl-alert{grid-row:2}#app>main{grid-row:3}#app>.dock{grid-row:4}#app>.tabs{grid-row:5}#app>.overlay-host,#app>.toast-host{grid-row:6}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px var(--gut-r) 6px var(--gut)}
.top h1{margin:0;font-size:var(--fs-l);font-weight:700}
.top-right{display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--muted)}
.sync:empty{display:none}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ledger);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px var(--gut-r) 20px var(--gut);display:flex;flex-direction:column;gap:14px;min-width:0}
main>*{min-width:0}
.num,.amount,.big,.amt,.total,.cl-amt,.stat b{font-variant-numeric:tabular-nums}

/* ---------- แถบเตือนเช็คลิสต์ (ค้างไว้จนติ๊กครบ) ---------- */
.cl-alert{all:unset;box-sizing:border-box;cursor:pointer;margin:0 var(--gut-r) 6px var(--gut);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:#FFF6D6;color:#4A3500;border:1px solid #F2D27A;border-radius:14px;padding:8px 12px;min-height:48px}
.cl-alert-icon{font-size:20px}
.cl-upcoming{margin:4px 0 0;font-weight:700;color:var(--save)}
.cl-alert-text{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.cl-alert-text b{font-size:var(--fs-b)}
.cl-alert-text small{font-size:12px;overflow-wrap:anywhere}
.cl-alert-go{background:#4A3500;color:#FFF6D6;font-weight:700;border-radius:999px;padding:6px 14px;font-size:var(--fs-s)}
.cl-alert.urgent{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.cl-alert.urgent .cl-alert-go{background:var(--bad);color:#fff}
.cl-alert:focus-visible{outline:3px solid var(--ledger);outline-offset:2px}
@media (prefers-color-scheme: dark){.cl-alert{background:#3A3010;color:#FFE7A0;border-color:#6B5518}.cl-alert-go{background:#FFE7A0;color:#3A3010}}

/* ---------- วันนี้ใช้ได้อีก (ตัวใหญ่) ---------- */
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:2px solid var(--ledger);border-radius:18px;padding:12px 16px}
.today p{margin:0}
.today-emoji{font-size:40px;line-height:1}
.today-label{font-size:var(--fs-m);font-weight:600}
.today-big{font-size:44px;font-weight:800;line-height:1.1;color:var(--ledger);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.today-sub{font-size:var(--fs-s);color:var(--muted)}
.today-cut{font-size:var(--fs-s);font-weight:700;color:var(--bad)}
.today-over{font-size:var(--fs-m);font-weight:800;color:var(--bad)}
.today-next{font-size:var(--fs-m);font-weight:700}
.today-next span{white-space:nowrap;font-weight:400;color:var(--muted);font-size:var(--fs-s)}
.today.empty{border-color:var(--bad)}
.today.empty .today-big{color:var(--bad);font-size:32px}

/* ---------- ความเร็วล่าสุด ---------- */
.speed-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.speed-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 12px;border-top:1px solid var(--line);font-size:var(--fs-b)}
.speed-list li:first-child{border-top:none}
.speed-list li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.speed-list li small{grid-column:1 / -1;color:var(--bad);font-size:12px}
.speed-list li.bad b{color:var(--bad)}

/* ---------- คู่มือคำ ---------- */
.lexicon{display:flex;flex-direction:column;gap:12px}
.lexicon h2{margin:0}
.lex-stat{margin:0;font-size:var(--fs-b)}
.lex-add{display:grid;grid-template-columns:1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.lex-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lex-list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:56px}
.lex-list li:first-child{border-top:none}
.lex-word{font-weight:700;min-width:0;overflow-wrap:anywhere;line-height:1.35}
.lex-word small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-s)}
.lex-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lex-meta small{color:var(--muted);font-size:12px;white-space:nowrap}
.lex-badge{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.lex-badge.user{background:var(--save-soft);color:var(--save);border-color:var(--save)}
.lex-del{all:unset;box-sizing:border-box;cursor:pointer;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted);font-size:16px}
.lex-del.asking{background:var(--bad);color:#fff;padding:0 10px;font-size:var(--fs-s);font-weight:700}
.lex-del:focus-visible{outline:3px solid var(--ledger);outline-offset:2px}
.lex-more{width:100%}

/* ---------- ทบทวนแผนเงิน (อินโฟกราฟิก) ---------- */
.info-btn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--ledger-soft);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-height:56px;margin-bottom:12px;width:100%}
.info-btn>span:first-child{font-size:24px}
.info-btn b{display:block;font-size:var(--fs-m)}
.info-btn small{display:block;color:var(--muted);font-size:var(--fs-s)}
.info-btn .go{font-size:26px;color:var(--ledger);font-weight:700}
.info-btn:focus-visible{outline:3px solid var(--ledger);outline-offset:2px}
.ig-bg{position:fixed;inset:0;background:rgba(5,20,40,.5);display:flex;align-items:center;justify-content:center;z-index:25;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.ig{background:var(--paper);width:100%;max-width:520px;max-height:100%;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.ig-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 10px 18px;background:var(--ledger);color:var(--ledger-ink)}
.ig-top h2{margin:0;font-size:var(--fs-l);line-height:1.3}
.ig-x{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.2);font-size:20px;font-weight:700}
.ig-x:focus-visible{outline:3px solid var(--ledger-ink);outline-offset:2px}
.ig-body{overflow-y:auto;overscroll-behavior:contain;padding:14px;display:flex;flex-direction:column;gap:12px;font-size:var(--fs-m)}
.ig-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.ig-card h3{margin:0 0 10px;display:flex;align-items:center;gap:10px;font-size:var(--fs-l);line-height:1.3}
.ig-n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:16px}
.ig-salary{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--save-soft);border-radius:14px;padding:12px 14px}
.ig-salary small{display:block;color:var(--muted);font-size:var(--fs-s)}
.ig-salary b{font-size:var(--fs-xl);color:var(--save);line-height:1.2}
.ig-list{list-style:none;margin:0;padding:0}
.ig-list li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.ig-list li:first-child{border-top:none}
.ig-emoji{font-size:24px;line-height:1}
.ig-name{min-width:0;font-weight:600;line-height:1.35}
.ig-name small{display:block;font-weight:400;color:var(--muted);font-size:var(--fs-s)}
.ig-amt{font-size:var(--fs-l);font-variant-numeric:tabular-nums}
.ig-list li.save .ig-amt{color:var(--save)}
.ig-note{margin:8px 0 0;color:var(--muted);font-size:var(--fs-b)}
.ig-months{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ig-months>li{background:var(--paper);border-radius:14px;padding:10px 12px}
.ig-months>li.now{background:var(--ledger-soft);outline:2px solid var(--ledger)}
.ig-mhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ig-mhead b{font-size:var(--fs-l)}
.ig-mhead small{margin-left:auto;color:var(--muted);font-size:var(--fs-s)}
.ig-tag{background:var(--ledger);color:var(--ledger-ink);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.ig-chips{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.ig-chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:var(--fs-b);font-variant-numeric:tabular-nums}
.ig-chips li.save{border-color:var(--save);color:var(--save)}
.ig-months .ig-note{margin:4px 0 0}
.ig-goals{display:flex;flex-direction:column;gap:10px}
.ig-goal{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;row-gap:4px;align-items:center;background:var(--save-soft);border-radius:14px;padding:12px}
.ig-goal.debt{background:var(--ledger-soft)}
.ig-goal>:not(.ig-emoji){grid-column:2}
.ig-goal .ig-emoji{grid-row:1 / span 4;align-self:start}
.ig-bar{display:block;height:10px;border-radius:10px;background:var(--surface);overflow:hidden}
.ig-bar i{display:block;height:100%;background:var(--save);border-radius:10px}
.ig-goal small{color:var(--muted);font-size:var(--fs-s)}
.ig-when{font-weight:700;color:var(--save)}
.ig-goal.debt .ig-when{color:var(--ledger)}
.ig-tips{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.ig-foot{padding:10px 14px max(12px,env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
.ig-foot .primary{width:100%;min-height:52px;font-size:var(--fs-m)}

/* ---------- ภาพรวม ---------- */
.hero{background:var(--ledger);color:var(--ledger-ink);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hero p{margin:0}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .label{font-size:var(--fs-s);opacity:.9}
.hero .big{font-size:var(--fs-xl);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.days{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;flex:none}
.days b{font-size:var(--fs-l)}
.days span{font-size:12px;opacity:.85}
.hero-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.hero-split div{display:flex;flex-direction:column;min-width:0}
.hero-split span{font-size:12px;opacity:.88}
.hero-split b{font-size:var(--fs-b);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cycle-bar{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
.cycle-bar i{display:block;height:100%;background:var(--ledger-ink);opacity:.8}
.hero-stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-s);opacity:.92}
.hero .warn{background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px;font-size:var(--fs-s);align-self:flex-start}

/* ---------- กระเป๋า (รายการ) ---------- */
.home{display:flex;flex-direction:column;gap:12px}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list-title{margin:0;padding:10px 14px 4px;font-size:var(--fs-s);font-weight:600;color:var(--muted)}
.pocket{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;padding:10px 14px 12px;border-top:1px solid var(--line);min-height:64px}
.list-title+.pocket{border-top:none}
.pocket:active{background:var(--paper)}
.idle{border-top:1px solid var(--line)}
.idle summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:var(--fs-s);color:var(--muted);min-height:44px;display:flex;align-items:center;justify-content:space-between}
.idle summary::-webkit-details-marker{display:none}
.idle summary::after{content:"แสดง";color:var(--ledger);font-weight:600}
.idle[open] summary::after{content:"ซ่อน"}
.pocket:focus-visible{outline:3px solid var(--ledger);outline-offset:-3px}
.pocket .emoji{font-size:22px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--paper)}
.pmid{display:flex;flex-direction:column;min-width:0}
.pname{font-weight:600;font-size:var(--fs-b);line-height:1.35;overflow-wrap:anywhere}
.hint{font-size:var(--fs-s);color:var(--muted);line-height:1.35}
.pright{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.pocket .amount{font-size:var(--fs-m);font-weight:700;line-height:1.25;white-space:nowrap}
.pocket .sub{font-size:12px;color:var(--muted);white-space:nowrap}
.pocket .bar{grid-column:2 / -1;display:block;height:5px;border-radius:5px;background:var(--ledger-soft);overflow:hidden}
.pocket .bar i{display:block;height:100%;background:var(--ledger);border-radius:5px}
.pocket.save .bar{background:var(--save-soft)} .pocket.save .bar i{background:var(--save)} .pocket.save .amount{color:var(--save)}
.pocket.over .amount,.pocket.over .hint{color:var(--bad)} .pocket.over .bar i{background:var(--bad)}

/* ---------- หน้าทั่วไป ---------- */
.welcome,.empty,.settings,.plan,.history .day,.card,.cl-head,.lock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.welcome h2,.settings h2,.plan h2{margin:0 0 4px;font-size:var(--fs-m)}
.welcome p,.settings p{margin:0 0 10px;color:var(--muted)}
.settings .sec{margin-top:22px}
.empty{text-align:center;color:var(--muted)}
.empty p{margin:0 0 10px}
.back{border:none;background:none;padding:0 0 4px;color:var(--ledger);font-weight:600;cursor:pointer;align-self:flex-start;min-height:36px}

.history{display:flex;flex-direction:column;gap:12px}
.day{padding:10px 14px!important}
.day h3{margin:0 0 2px;font-size:var(--fs-s);color:var(--muted);font-weight:600}
.day ul{list-style:none;margin:0;padding:0}
.day li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.day li:first-child{border-top:none}
.day .emoji{font-size:20px}
.what{display:flex;flex-direction:column;min-width:0}
.what b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.what small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700;white-space:nowrap}
.amt.deposit,.amt.transfer,.amt.income{color:var(--save)}
.add-income{width:100%;min-height:52px;border:2px dashed var(--save);background:var(--save-soft);color:var(--save);border-radius:16px;font-size:var(--fs-m);font-weight:700;cursor:pointer}
.income-form{display:grid;gap:10px;background:var(--surface);border:2px solid var(--save);border-radius:16px;padding:16px}
.income-form h3{margin:0}
.income-form #inc-amt{font-size:var(--fs-m);font-weight:700}
.inc-pockets{display:grid;gap:6px;border:none;margin:0;padding:0;min-width:0}
.inc-pockets legend{font-size:var(--fs-s);color:var(--muted);padding:0;margin-bottom:4px}
.inc-pockets label{display:flex;gap:8px;align-items:center;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;overflow-wrap:anywhere}
.inc-pockets input{flex:none;width:22px;height:22px;min-height:0;margin:0;padding:0;accent-color:var(--save)}
.inc-pockets label.on{border-color:var(--save);background:var(--save-soft);font-weight:700}
.inc-hint{margin:0;font-size:var(--fs-s);color:var(--muted)}
.del{border:none;background:none;color:var(--muted);min-width:40px;min-height:40px;border-radius:10px;cursor:pointer}
.del.ask{background:var(--bad-soft);color:var(--bad);font-size:var(--fs-s);font-weight:600;padding:0 10px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:var(--fs-s);color:var(--muted)}
input,select{width:100%;min-width:0;min-height:46px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:16px}
input:focus,select:focus{outline:2px solid var(--ledger);outline-offset:1px}
.row1{display:grid;grid-template-columns:1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:4rem minmax(0,1fr) 7rem;gap:10px}
.emoji-in{text-align:center}
.plan{display:flex;flex-direction:column;gap:14px}
.pedit{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.totals{margin:0;background:var(--ledger-soft);border-radius:12px;padding:8px 12px;font-weight:600;font-size:var(--fs-s)}
.totals.bad{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.primary,.ghost{border-radius:12px;min-height:46px;padding:10px 18px;font-weight:600;cursor:pointer;border:1px solid transparent}
.primary{background:var(--ledger);color:var(--ledger-ink)}
.ghost{background:transparent;border-color:var(--line)}
.primary:disabled,.send:disabled{opacity:.55;cursor:default}
.link{border:none;background:none;padding:6px 0;cursor:pointer;align-self:flex-start;font-size:var(--fs-s);text-decoration:underline;min-height:36px}
.danger{color:var(--bad)}
.note{font-size:var(--fs-s);color:var(--muted)}
.check-field{display:flex;gap:10px;align-items:center;font-size:var(--fs-s);min-height:40px}
.check-field input{width:22px;height:22px;min-height:0;accent-color:var(--ledger)}

/* ---------- แถบพูด (ถนัดขวา) ---------- */
.dock{display:flex;gap:10px;align-items:center;padding:8px var(--gut-r) 8px var(--gut);background:var(--paper);border-top:1px solid var(--line)}
.say-box{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;min-height:52px}
.say-box input{flex:1;min-width:0;min-height:0;border:none;background:transparent;padding:8px 0;font-size:16px}
.say-box input:focus{outline:none}
.say-box:focus-within{outline:2px solid var(--ledger);outline-offset:1px}
.send{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:var(--ledger-soft);color:var(--ledger);font-size:18px;cursor:pointer}
.mic{width:60px;height:60px;flex:none;border-radius:50%;border:none;background:var(--mic);color:var(--mic-ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 4px 14px rgba(22,115,212,.28);touch-action:manipulation}
.mic-icon{font-size:22px}
.mic-label{font-size:12px;font-weight:700}
.mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.45)}50%{box-shadow:0 0 0 12px rgba(211,47,47,0)}}

/* ---------- เมนูล่าง ---------- */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px var(--gut-r) calc(4px + env(safe-area-inset-bottom)) var(--gut)}
.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;color:var(--muted);cursor:pointer;border-radius:12px;padding:2px}
.tab-icon{font-size:20px;line-height:1.2}
.tab-label{font-size:12px;line-height:1.2;white-space:nowrap}
.tabs button.on{color:var(--ledger);font-weight:700;background:var(--ledger-soft)}

/* ---------- หน้ายืนยัน (แผ่นล่าง) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px var(--gut-r) calc(12px + env(safe-area-inset-bottom)) var(--gut);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:var(--fs-m)}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.sheet .actions button{flex:1}
.ainote{margin:0;background:var(--ledger-soft);border-radius:12px;padding:8px 12px;font-size:var(--fs-s)}
.citem{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;align-self:end;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:46px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;cursor:pointer;font-size:var(--fs-s)}
.seg button.on{background:var(--ledger);color:var(--ledger-ink);font-weight:600}
.total{margin:0;text-align:right;font-weight:700;font-size:var(--fs-m)}

/* ---------- แจ้งเตือน: อยู่เหนือแถบพูด ไม่ทับเนื้อหาหลักตลอด ---------- */
.toast-host{position:absolute;left:0;right:0;bottom:calc(140px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 var(--gut-r) 0 var(--gut)}
.toast{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;max-width:100%;font-size:var(--fs-s);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}

/* ---------- เช็คลิสต์ ---------- */
.cl-banner{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px}
.cl-banner b{color:var(--ledger)}
.cl-banner:focus-visible{outline:3px solid var(--ledger);outline-offset:2px}
.checklist{display:flex;flex-direction:column;gap:12px}
.cl-head h2{margin:0;font-size:var(--fs-m)}
.cl-head p{margin:4px 0 8px;color:var(--muted);font-size:var(--fs-s)}
.cl-head .bar{display:block;height:6px;border-radius:6px;background:var(--ledger-soft);overflow:hidden}
.cl-head .bar i{display:block;height:100%;background:var(--ledger)}
.cl-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cl-list li{border-top:1px solid var(--line);transition:opacity .25s}
.cl-list li:first-child{border-top:none}
.cl-list li>label{display:grid;grid-template-columns:28px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:60px}
.cl-list input[type=checkbox]{width:26px;height:26px;min-height:0;margin:0;accent-color:var(--ledger)}
.cl-list .emoji{font-size:20px}
.cl-name{display:flex;flex-direction:column;font-weight:600;min-width:0}
.cl-name small{font-weight:400;color:var(--muted);font-size:12px}
.cl-amt{font-weight:700;font-size:var(--fs-m);white-space:nowrap}
.cl-list li.done{opacity:.5}
.cl-list li.editing{background:var(--ledger-soft, #E6F1FC)}
.cl-edit{display:grid;gap:8px;padding:0 14px 12px 52px}
.cl-edit .field input{font-size:var(--fs-m);font-weight:700}
.cl-edit-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cl-list li.done .cl-name>span,.cl-list li.done .cl-amt{text-decoration:line-through}

/* ---------- สรุป ---------- */
.dash{display:flex;flex-direction:column;gap:14px}
.card{display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:var(--fs-b)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font-size:var(--fs-m);overflow-wrap:anywhere}
.stat.out b{color:var(--bad)} .stat.save b{color:var(--save)}
.pbars{display:flex;flex-direction:column;gap:12px}
.pbar-top{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-s)}
.pbar-top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.pbar-track{display:block;height:8px;border-radius:8px;background:var(--paper);overflow:hidden;margin-top:4px}
.pbar-track i{display:block;height:100%;border-radius:4px;background:var(--chart-spend)}
.pbar.save .pbar-track i{background:var(--chart-save)}
.pbar.over .pbar-track i{background:var(--bad)} .pbar.over .pbar-val{color:var(--bad);font-weight:600}
.readout{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.dchart{width:100%;height:auto;display:block}
.dchart .axis{stroke:var(--chart-grid);stroke-width:1}
.dchart .hit{fill:transparent;cursor:pointer}
.dchart .bar{fill:var(--chart-spend)}
.dchart .future .bar{opacity:.25}
.dchart .over .bar{fill:var(--bad)}
.dchart .picked .bar{stroke:var(--ink);stroke-width:1.5}
.dchart .limit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.dchart .limit-label,.dchart .tick{fill:var(--muted);font-size:10px;font-family:var(--font)}

/* ---------- หน้า PIN ---------- */
.lock{display:flex;flex-direction:column;gap:12px;text-align:center;margin-top:12px}
.lock h2{margin:0;font-size:var(--fs-l)}
.lock p{margin:0;color:var(--muted)}
.lock-icon{font-size:36px}
.lock .field{text-align:left}
.pin-in{font-size:24px;letter-spacing:.4em;text-align:center;padding:12px}
.big-btn{min-height:52px;font-size:var(--fs-m)}
.steps-list{text-align:left;margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:6px}
.warn-text{color:var(--bad)!important;font-weight:600}

/* ---------- จอแคบมาก ---------- */
@media (max-width:380px){
  .row3{grid-template-columns:3.6rem minmax(0,1fr)}
  .row3 .field:last-child{grid-column:1/-1}
  .row2{grid-template-columns:1fr}
  .seg{align-self:stretch}
}
@media (max-width:340px){
  .tab-label{font-size:11px}
  .hero .big{font-size:24px}
}
@media (prefers-reduced-motion: reduce){.spin,.mic.on{animation:none}.cl-list li{transition:none}}
